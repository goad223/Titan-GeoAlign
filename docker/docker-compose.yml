# =============================================================================
#  Titan-GeoAlign — Docker Compose
#
#  Services:
#    titan-api        CPU inference API  (always-on)
#    titan-api-gpu    GPU inference API  (profile: gpu)
#    prometheus       Metrics scraping
#    grafana          Dashboards
#
#  Usage:
#    CPU only:  docker compose up
#    With GPU:  docker compose --profile gpu up
# =============================================================================

version: "3.9"

x-common-env: &common-env
  TITAN_CONFIG_DIR: /app/configs
  TITAN_MODELS_DIR: /app/models
  TITAN_LOG_LEVEL: INFO
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

x-common-volumes: &common-volumes
  - ./configs:/app/configs:ro
  - ./models:/app/models:ro
  - titan-data:/app/data
  - titan-logs:/app/logs

services:
  # ── CPU API ──────────────────────────────────────────────────────────────────
  titan-api:
    image: titan-geoalign:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: titan-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      TITAN_DEVICE: cpu
    volumes: *common-volumes
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 16G
    labels:
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=8000"
      - "prometheus.io/path=/metrics"

  # ── GPU API ───────────────────────────────────────────────────────────────────
  titan-api-gpu:
    image: titan-geoalign:gpu
    build:
      context: ..
      dockerfile: docker/Dockerfile.gpu
    container_name: titan-api-gpu
    profiles: [gpu]
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      <<: *common-env
      TITAN_DEVICE: cuda
      NVIDIA_VISIBLE_DEVICES: all
    volumes: *common-volumes
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          memory: 32G
    labels:
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=8000"
      - "prometheus.io/path=/metrics"

  # ── Prometheus ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - titan-api

  # ── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-titan-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3000"
      GF_INSTALL_PLUGINS: "grafana-piechart-panel"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus

volumes:
  titan-data:
    driver: local
  titan-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  default:
    name: titan-network
    driver: bridge
