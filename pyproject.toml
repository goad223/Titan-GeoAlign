[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "titan-geoalign"
version = "0.1.0"
description = "Foundation model for geospatial image alignment and registration using deep learning"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
  { name = "Titan-GeoAlign Contributors" },
]
keywords = [
  "geospatial",
  "image-alignment",
  "remote-sensing",
  "deep-learning",
  "pytorch",
  "computer-vision",
  "gdal",
  "rasterio",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  # Deep learning core
  "torch>=2.6",
  "torchvision",
  "torchaudio",
  "einops>=0.8.0",
  "timm>=1.0.9",
  "accelerate>=0.34.2",
  "kornia>=0.7.3",
  # Hugging Face ecosystem
  "transformers>=4.48.0",
  "diffusers>=0.30.0",
  "huggingface-hub>=0.24.6",
  "safetensors>=0.4.5",
  # Geospatial stack
  "gdal>=3.8.4",
  "rasterio>=1.3.10",
  "pyproj>=3.6.1",
  "shapely>=2.0.3",
  "fiona>=1.10.1",
  "geopandas>=1.1.2",
  "xarray>=2024.7.0",
  "dask[complete]>=2024.9.0",
  "dask-geopandas>=0.4.0",
  "arosics>=1.10.3",
  "py-tools-ds>=0.22.0",
  # 3D / point cloud
  "open3d>=0.18.0",
  "laspy>=2.5.0",
  # Computer vision / image processing
  "opencv-python-headless>=4.10.0.84",
  "scikit-image>=0.24.0",
  "pillow>=12.2.0",
  # Numerical / data science
  "numpy>=1.26.4",
  "scipy>=1.13.0",
  "pandas>=2.2.2",
  "matplotlib>=3.9.2",
  # Distributed computing
  "ray[default]>=2.52.0",
  # API / serving
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "grpcio>=1.66.0",
  "grpcio-tools>=1.66.0",
  "httpx>=0.27.2",
  # Config / CLI
  "pydantic>=2.9.0",
  "typer[all]>=0.12.5",
  "rich>=13.8.0",
  "omegaconf>=2.3.0",
  "hydra-core>=1.3.2",
  "click>=8.1.0",
  # Observability / experiment tracking
  "structlog>=24.4.0",
  "mlflow>=2.22.4",
  "dvc>=3.55.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-prometheus>=0.48b0",
  "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
gpu = [
  "xformers>=0.0.28",
]
dev = [
  "pytest>=8.3.3",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.24.0",
  "black>=26.3.1",
  "ruff>=0.6.9",
  "mypy>=1.11.2",
  "pre-commit>=3.8.0",
  "faker>=28.1.0",
  "types-Pillow",
  "types-requests",
]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.26.0",
]

[project.urls]
Homepage = "https://github.com/goad223/Titan-GeoAlign"
Repository = "https://github.com/goad223/Titan-GeoAlign"
Issues = "https://github.com/goad223/Titan-GeoAlign/issues"
Changelog = "https://github.com/goad223/Titan-GeoAlign/blob/main/CHANGELOG.md"

[project.scripts]
titan-align = "cli.main:app"

# ---------------------------------------------------------------------------
# Hatch
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/titan_geoalign", "cli"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
  "/docs",
  "/tests",
  "/data",
  "/models",
]

# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "SIM", # flake8-simplify
  "TCH", # flake8-type-checking
  "RUF", # ruff-specific rules
]
ignore = [
  "E501",  # line length handled by black
  "B008",  # do not perform function calls in default arguments (FastAPI pattern)
  "B905",  # zip() without strict argument
]

[tool.ruff.lint.isort]
known-first-party = ["titan_geoalign", "cli"]
split-on-trailing-comma = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["build/", "dist/"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
  "--cov=src/titan_geoalign",
  "--cov-report=term-missing",
  "--cov-report=xml",
]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "unit: unit tests (fast, no I/O)",
  "integration: integration tests (may require external resources)",
  "gpu: tests requiring a CUDA-capable GPU",
  "slow: tests that take > 30 seconds",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:pkg_resources",
  "ignore::UserWarning:torch",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/titan_geoalign"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
]
