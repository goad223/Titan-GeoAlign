apiVersion: apps/v1
kind: Deployment
metadata:
  name: titan-geoalign
  namespace: titan
  labels:
    app: titan-geoalign
    component: api
    version: "0.1.0"
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: titan-geoalign
      component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: titan-geoalign
        component: api
        version: "0.1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: titan-geoalign
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      terminationGracePeriodSeconds: 60

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: titan-geoalign

      initContainers:
        - name: model-check
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Checking model volume mount…"
              ls -la /models/foundation /models/matchers || \
                { echo "WARNING: model directories empty"; }
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true

      containers:
        - name: titan-api
          image: ghcr.io/goad223/titan-geoalign:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: TITAN_DEVICE
              value: "cpu"
            - name: TITAN_CONFIG_DIR
              value: "/app/configs"
            - name: TITAN_MODELS_DIR
              value: "/models"
            - name: TITAN_LOG_LEVEL
              value: "INFO"
            - name: PYTHONUNBUFFERED
              value: "1"
            # Secret-based env vars
            - name: TITAN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: titan-secrets
                  key: api-key
                  optional: true
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: config
              mountPath: /app/configs
              readOnly: true
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "16Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: titan-models-pvc
        - name: config
          configMap:
            name: titan-config
        - name: data
          emptyDir:
            sizeLimit: 50Gi
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi

      imagePullSecrets:
        - name: ghcr-credentials
